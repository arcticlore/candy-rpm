name: AZ-5 аварийная кнопка
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'off = АЗ-5 (полный отруб проекта) | on = снять остановку'
        required: true
        default: 'off'
        type: choice
        options:
          - off
          - on

permissions:
  contents: write
  actions: write

jobs:
  button:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Flip marker
        id: flip
        run: |
          if [ "$ACTION" = "off" ]; then
            touch AZ5
            echo "state=off" >> "$GITHUB_OUTPUT"
            echo "АЗ-5 нажата"
          else
            echo "state=on" >> "$GITHUB_OUTPUT"
            echo "АЗ-5 снята"
          fi
          git config user.name  "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          if [ "$ACTION" = "off" ]; then
            git add -A AZ5
          else
            # git rm --ignore-unmatch: 0 и когда файла нет ни в индексе, ни в worktree
            git rm --ignore-unmatch -q -f AZ5
          fi
          if git diff --cached --quiet; then
            echo "маркер уже в этом состоянии"
          else
            git commit -qm "az5: $ACTION [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
          fi
        env:
          ACTION: ${{ inputs.action }}

      - name: Scram in-flight GitHub runs
        if: steps.flip.outputs.state == 'off'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ME="$GITHUB_RUN_ID"
          for id in $(gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f status=in_progress -f per_page=100 \
              --jq '.workflow_runs[].id' 2>/dev/null); do
            [ "$id" = "$ME" ] && continue
            echo "scram run $id"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
          done

      - name: Cancel COPR builds + cut net (off)
        if: steps.flip.outputs.state == 'off'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_API: https://copr.fedorainfracloud.org/api_3
        run: |
          # Сервис не имеет права бросать "нельзя, работают билды":
          # сначала мгновенно отменяем running/pending, потом глушим сеть.
          mkdir -p ~/.config
          echo "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          LOGIN=$(grep -m1 '^login' ~/.config/copr | cut -d= -f2 | tr -d ' ')
          TOKEN=$(grep -m1 '^token' ~/.config/copr | cut -d= -f2 | tr -d ' ')
          for st in running pending; do
            for id in $(curl -4 -s --max-time 30 -u "$LOGIN:$TOKEN" \
                "${COPR_API}/builds?ownername=arcticlore&projectname=candy&status=$st&limit=200" \
                | python3 -c "
          import json,sys
          for b in json.load(sys.stdin).get('items',[]):
              print(b.get('id'))
          "); do
              echo "cancel copr $id ($st)"
              curl -4 -s --max-time 30 -u "$LOGIN:$TOKEN" -X PUT \
                "${COPR_API}/build/cancel/$id" || true
              sleep 1
            done
          done
          echo "--- net off ---"
          curl -4 -s --max-time 30 -u "$LOGIN:$TOKEN" -X POST \
            -H "Content-Type: application/json" -d '{"enable_net": false}' \
            "${COPR_API}/project/edit/arcticlore/candy" \
            | python3 -c "import sys,json;print('enable_net =>', json.load(sys.stdin).get('enable_net'))"

      - name: Restore COPR net (on)
        if: steps.flip.outputs.state == 'on'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          COPR_API: https://copr.fedorainfracloud.org/api_3
        run: |
          mkdir -p ~/.config
          echo "$COPR_CONFIG" > ~/.config/copr
          chmod 600 ~/.config/copr
          LOGIN=$(grep -m1 '^login' ~/.config/copr | cut -d= -f2 | tr -d ' ')
          TOKEN=$(grep -m1 '^token' ~/.config/copr | cut -d= -f2 | tr -d ' ')
          curl -4 -s --max-time 30 -u "$LOGIN:$TOKEN" -X POST \
            -H "Content-Type: application/json" -d '{"enable_net": true}' \
            "${COPR_API}/project/edit/arcticlore/candy" \
            | python3 -c "import sys,json;print('enable_net =>', json.load(sys.stdin).get('enable_net'))"

      - name: Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "${{ steps.flip.outputs.state }}" = "off" ]; then
            MSG=$(printf '☢️ <b>АЗ-5 нажата</b>\nВсе автоматизации остановлены, билды отменены.\nВключить: workflow «AZ-5 аварийная кнопка» → on')
          else
            MSG=$(printf '💚 <b>АЗ-5 снята</b>\nАвтоматизации снова работают.')
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT_ID" -d parse_mode=HTML \
            --data-urlencode "text=$MSG" >/dev/null 2>&1 || true