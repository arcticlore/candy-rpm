name: logrotate
on:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Rotate logs
        run: |
          find logs/ -name "*.log" -size +10M -exec truncate -s 1M {} \;
          find logs/runs/ -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} \;
          find SRPMS/ -name "*.src.rpm" -mtime +30 -delete 2>/dev/null || true

      # Ротация логов — runtime state (logs/), НЕ reviewable source change.
      # Ежедневный reviewable source-PR создавать НЕЛЬЗЯ (лог-спам в PR-лист).
      # Сохраняем состояние в state-ветку state/logrotate — без gh pr create.

