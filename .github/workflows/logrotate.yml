name: logrotate
on:
  schedule:
    - cron: "0 4 * * *"   # каждый день в 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Rotate logs
        run: |
          find logs/ -name "*.log" -size +10M -exec truncate -s 1M {} \;
          find logs/runs/ -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} \;
          find SRPMS/ -name "*.src.rpm" -mtime +30 -delete 2>/dev/null || true

      # Ротация логов — runtime state (logs/), НЕ reviewable source change.
      # Ежедневный reviewable source-PR создавать НЕЛЬЗЯ (лог-спам в PR-лист).
      # Сохраняем состояние в state-ветку state/logrotate — без gh pr create.
      - name: Commit (state/logrotate — runtime state, БЕЗ gh pr)
        run: |
          git config user.name  "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          git add logs/ SRPMS/ || true
          if ! git diff --cached --quiet; then
            git commit -qm "logrotate [skip ci]"
            git branch -f "state/logrotate" HEAD
            git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "state/logrotate" || true
            # gh pr create НЕ вызываем: логи — runtime state, ежедневный source-PR запрещён.
          fi
