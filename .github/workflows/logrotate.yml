name: logrotate
on:
  schedule:
    - cron: "0 4 * * *"   # каждый день в 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Rotate logs
        run: |
          find logs/ -name "*.log" -size +10M -exec truncate -s 1M {} \;
          find logs/runs/ -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} \;
          find SRPMS/ -name "*.src.rpm" -mtime +30 -delete 2>/dev/null || true

      - name: Commit
        run: |
          git config user.name  "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          git add -A logs/ SRPMS/ || true
          if ! git diff --cached --quiet; then
            git commit -qm "logrotate [skip ci]"
            git branch "bot/logrotate-${{ github.run_number }}"
            git checkout -q "bot/logrotate-${{ github.run_number }}"
            git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "bot/logrotate-${{ github.run_number }}" || true
            gh pr create --base master --head "bot/logrotate-${{ github.run_number }}"               --title "logrotate state #${{ github.run_number }} [skip ci]"               --body "State sync от logrotate (без прямой записи в master). Merge = только при подтверждении ревьюера." 2>&1 || true
          fi
