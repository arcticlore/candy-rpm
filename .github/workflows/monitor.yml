name: monitor
on:
  schedule:
    - cron: "23 */2 * * *"   # каждые 2 часа — не грузим COPR лишними опросами
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Снапшот берётся РОВНО ОДИН раз (curl --fail-with-body с ретраями,
      # ответ во временный файл + валидация JSON) и переиспользуется ниже.
      # При недоступности COPR — ::error и красный шаг, а не JSONDecodeError.
      - name: COPR status snapshot + failed list
        run: python3 tools/coprsnap.py snapshot --out "$RUNNER_TEMP/coprsnap.json"

      # Шаг выполняется и после падения snapshot: по снапшоту различает
      # «есть актуальный failed build» и «данные COPR недоступны».
      - name: Telegram alert on failures
        if: ${{ !cancelled() }}
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: python3 tools/coprsnap.py telegram --snapshot "$RUNNER_TEMP/coprsnap.json"
