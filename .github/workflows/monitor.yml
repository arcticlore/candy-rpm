name: monitor
on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: COPR status snapshot
        run: |
          curl -4 -s --connect-timeout 10 \
            "https://copr.fedorainfracloud.org/api_3/build/list?ownername=arcticlore&projectname=candy&limit=200" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          counts={}
          for b in d.get('items',[]):
              s=b.get('state','?')
              counts[s]=counts.get(s,0)+1
          for s,c in sorted(counts.items(), key=lambda x:-x[1]):
              print(f'{s}: {c}')
          " 2>&1

      - name: Failed packages
        run: |
          curl -4 -s --connect-timeout 10 \
            "https://copr.fedorainfracloud.org/api_3/build/list?ownername=arcticlore&projectname=candy&limit=200" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          failed=[b['source_package']['name'] for b in d.get('items',[]) if b.get('state')=='failed']
          if failed:
              print('FAILED:', ', '.join(sorted(set(failed))))
          else:
              print('No failed packages')
          " 2>&1

      - name: Dashboard
        run: python3 bin/gen-pages-html.py || true

      - name: Commit dashboard
        run: |
          git config user.name  "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          git add docs/index.html || true
          if ! git diff --cached --quiet; then
            git commit -qm "dashboard update [skip ci]"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:master
          fi
