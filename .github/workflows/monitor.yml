name: monitor
on:
  schedule:
    - cron: "23 */2 * * *"   # каждые 2 часа — не грузим COPR лишними опросами
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      off: ${{ steps.check.outputs.off }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f AZ5 ]; then
            echo "АЗ-5: проект остановлен — мониторинг пропущен"
            echo "off=true" >> "$GITHUB_OUTPUT"
          else
            echo "off=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: guard
    if: needs.guard.outputs.off == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: COPR status snapshot + failed list
        run: |
          API="https://copr.fedorainfracloud.org/api_3/build/list?ownername=arcticlore&projectname=candy&limit=200"
          curl -4 -s --connect-timeout 10 "$API" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          counts={}
          failed=set()
          for b in d.get('items',[]):
              s=b.get('state','?')
              counts[s]=counts.get(s,0)+1
              if s=='failed': failed.add(b['source_package']['name'])
          for s,c in sorted(counts.items(), key=lambda x:-x[1]):
              print(f'{s}: {c}')
          if failed:
              print('FAILED:', ', '.join(sorted(failed))[:300])
          else:
              print('No failed packages')
          " 2>&1

      - name: Telegram alert on failures
        run: |
          FAILED=$(curl -4 -s --connect-timeout 10 \
            "https://copr.fedorainfracloud.org/api_3/build/list?ownername=arcticlore&projectname=candy&limit=200" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          failed=[b['source_package']['name'] for b in d.get('items',[]) if b.get('state')=='failed']
          print(','.join(sorted(set(failed))) if failed else '')
          " 2>/dev/null)
          if [ -n "$FAILED" ]; then
            CHAT_ID="${{ secrets.TG_CHAT_ID }}"
            BOT_TOKEN="${{ secrets.TG_BOT_TOKEN }}"
            if [ -n "$CHAT_ID" ] && [ -n "$BOT_TOKEN" ]; then
              MSG="⚠️ <b>candy monitor</b>: failed packages detected
              $(echo "$FAILED" | tr ',' '\n' | head -10 | sed 's/^/• /')"
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d chat_id="$CHAT_ID" -d parse_mode=HTML -d text="$MSG" >/dev/null 2>&1 || true
            fi
          fi
