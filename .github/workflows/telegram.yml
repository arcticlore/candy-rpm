name: telegram bot
on:
  schedule:
    - cron: "*/5 * * * *"   # единственный хост бота (максимально часто)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      off: ${{ steps.check.outputs.off }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f AZ5 ]; then
            echo "АЗ-5: проект остановлен — бот пропущен"
            echo "off=true" >> "$GITHUB_OUTPUT"
          else
            echo "off=false" >> "$GITHUB_OUTPUT"
          fi

  listen:
    needs: guard
    if: needs.guard.outputs.off == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5

      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # Run bot for ~3.5 minutes (long-poll timeout=50s)
          timeout 210 python3 tools/tg-notify.py --listen || true

      - name: Save state
        run: |
          git config user.name  "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          git add state/tg-offset.txt || true
          if ! git diff --cached --quiet; then
            git commit -qm "tg offset [skip ci]" || true
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:master || true
          fi
