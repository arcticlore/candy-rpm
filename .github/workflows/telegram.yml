name: telegram bot
on:
  schedule:
    - cron: "*/5 * * * *"   # единственный хост бота (максимально часто)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5

      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # Run bot for ~3.5 minutes (long-poll timeout=50s)
          timeout 210 python3 tools/tg-notify.py --listen || true

      # tg-offset — рабочее СОСТОЯНИЕ бота (runtime state), не reviewable
      # source change. Прямая запись в master запрещена, а gh pr create
      # каждые 5 минут = бот-спам в PR-лист. Пишем offset в отдельную
      # state-ветку state/tg-offset (без создания PR).
      - name: Save state (state/tg-offset — runtime state, БЕЗ gh pr)
        run: |
          git config user.name  "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          git add state/tg-offset.txt || true
          if ! git diff --cached --quiet; then
            git commit -qm "tg offset [skip ci]"
            git branch -f "state/tg-offset" HEAD
            git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "state/tg-offset" || true
            # gh pr create НЕ вызываем: offset — runtime state, PR-спам каждые 5 мин запрещён.
          fi
