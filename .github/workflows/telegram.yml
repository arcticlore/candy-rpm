name: telegram bot
on:
  schedule:
    - cron: "*/5 * * * *"   # единственный хост бота (максимально часто)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-listen
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Restore offset (state/tg-offset — runtime state, fetch до старта)
        run: |
          git fetch -q origin "state/tg-offset:refs/remotes/origin/state/tg-offset" 2>/dev/null || true
          OFFSET=$(git show "origin/state/tg-offset:state/tg-offset.txt" 2>/dev/null || true)
          [ -n "$OFFSET" ] && { echo "$OFFSET" > state/tg-offset.txt; echo "offset restored: $OFFSET"; } || echo "offset не найден — стартуем с нуля"

      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # Run bot for ~3.5 minutes (long-poll timeout=50s)
          timeout 210 python3 tools/tg-notify.py --listen || true

      # tg-offset — рабочее СОСТОЯНИЕ бота (runtime state), не reviewable
      # source change. Прямая запись в master запрещена, а gh pr create
      # каждые 5 минут = бот-спам в PR-лист. Пишем offset в отдельную
      # state-ветку state/tg-offset (без создания PR).
      - name: Save state (state/tg-offset — runtime state, БЕЗ gh pr)
        run: |
          git config user.name  "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          git add state/tg-offset.txt || true
          if ! git diff --cached --quiet; then
            git commit -qm "tg offset [skip ci]"
            git branch -f "state/tg-offset" HEAD
            CUR=$(git rev-parse HEAD)
            BASE=$(git rev-parse origin/state/tg-offset 2>/dev/null || echo none)
            if [ "$CUR" != "$BASE" ]; then git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" state/tg-offset || exit 1; fi
            # gh pr create НЕ вызываем: offset — runtime state, PR-спам каждые 5 мин запрещён.
          fi
