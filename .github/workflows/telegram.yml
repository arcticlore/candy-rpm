name: telegram bot
on:
  schedule:
    - cron: "*/5 * * * *"   # единственный хост бота (максимально часто)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tg-listen
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Restore offset (state/tg-offset — runtime state, fetch до старта)
        run: |
          git fetch -q origin "state/tg-offset:refs/remotes/origin/state/tg-offset" 2>/dev/null || true
          OFFSET=$(git show "origin/state/tg-offset:state/tg-offset.txt" 2>/dev/null || true)
          [ -n "$OFFSET" ] && { echo "$OFFSET" > state/tg-offset.txt; echo "offset restored: $OFFSET"; } || echo "offset не найден — стартуем с нуля"

      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # Run bot for ~3.5 minutes (long-poll timeout=50s)
          timeout 210 python3 tools/tg-notify.py --listen || true

      # tg-offset — рабочее СОСТОЯНИЕ бота (runtime state), не reviewable
      # source change. Прямая запись в master запрещена, а gh pr create
      # каждые 5 минут = бот-спам в PR-лист. tools/tg-offset-save.sh
      # сохраняет новый offset во временный файл, fetch'ит origin/state/tg-offset,
      # делает commit поверх remote-ветки и пушит HEAD:state/tg-offset —
      # обычный push, fast-forward, без force и без PR.
      - name: Save state (state/tg-offset — runtime state, БЕЗ gh pr)
        env:
          TG_OFFSET_PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: bash tools/tg-offset-save.sh state/tg-offset.txt
