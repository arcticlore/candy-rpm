name: nightly update
on:
  schedule:
    - cron: "0 */2 * * *"   # каждые 2 часа
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          dnf install -y copr-cli golang npm jq git cargo rust \
                         rpm-build rpmdevtools >/dev/null

      - name: Configure COPR
        run: |
          mkdir -p ~/.config
          echo "${{ secrets.COPR_CONFIG }}" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Converge — волны до полной передачи в COPR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDY_PROJ: arcticlore/candy
        run: bin/converge.sh 8   # красным, если что-то так и не улетело

      - name: Upload logs + state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-logs
          path: |
            logs/
            state/state.json
