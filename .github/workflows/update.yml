name: submit to copr
on:
  schedule:
    - cron: "17 2,14 * * *"   # 2 раза/сутки (5:17 и 17:17 MSK) — вежливо к общим билдерам COPR
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Полный ребилд всех пакетов (напр. после добавления чрута F45)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container: fedora:44
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          mkdir -p logs
          dnf install -y jq git rpm-build rpmdevtools dnf-plugins-core python3 golang \
            cargo rust copr-cli nodejs24 nodejs24-npm-bin > logs/dnf-install.log 2>&1 \
            || { echo "dnf install failed:"; tail -20 logs/dnf-install.log; exit 1; }
          tail -5 logs/dnf-install.log
          mv logs/dnf-install.log logs/dnf-install-full.log

      - name: Configure COPR
        run: |
          mkdir -p ~/.config
          echo "${{ secrets.COPR_CONFIG }}" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Generate specs
        run: python3 bin/gen_specs.py --all

      - name: Refresh upstream versions (цели для сабмита)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 bin/coprase-status.py versions 2>&1 | tee logs/versions.log

      - name: Restore SRPM cache
        uses: actions/cache@v5
        with:
          path: |
            SRPMS/
            SOURCES/
          # Ключ = хэш источников правды, от которых зависит содержимое SRPM:
          # pkgs.json (версии/BR/bins), генератор spec и скрипт сборки SRPM.
          # Любое их изменение инвалидирует кэш и форсирует пересборку SRPM
          # для пакетов со статусом submission. restore-keys намеренно НЕТ:
          # префикс подтянул бы стейл-SRPM (собранные до фикса perl/noman/install)
          # и снова отправил бы их в COPR.
          key: srpm-cache-${{ hashFiles('pkgs.json', 'bin/gen_specs.py', 'bin/make-srpm.sh') }}

      - name: Build SRPMs for packages needing submission
        run: |
          set -o pipefail
          echo "=== Building/rebuilding SRPMs for packages needing submission ==="
          CHECK=$(python3 bin/coprase-status.py check 2>&1)
          echo "$CHECK" | tee logs/check.log
          TO_SUBMIT=$(echo "$CHECK" | grep -E "has SRPM|no SRPM" | awk '{print $1}' || true)

          BUILT=0
          FAILED=0
          SKIPPED=0
          for name in $TO_SUBMIT; do
            target=$(jq -r --arg n "$name" '.[$n].ver // ""' state/state.json)
            if [ -z "$target" ]; then
              echo "  [SKIP] $name: нет цели в state.json"
              SKIPPED=$((SKIPPED+1))
              continue
            fi
            if ls SRPMS/$name-$target-*.src.rpm >/dev/null 2>&1; then
              echo "  [FINE] $name: SRPM уже на цели $target"
              continue
            fi
            echo "  [BUILD SRPM] $name ($target)"
            if bin/make-srpm.sh "$name" "$target" > "logs/srpm-$name.log" 2>&1; then
              echo "  [OK] $name ($target)"
              BUILT=$((BUILT+1))
            else
              rc=$?
              echo "  [FAIL] $name (rc=$rc) — хвост лога:"
              tail -8 "logs/srpm-$name.log" | sed 's/^/    /'
              FAILED=$((FAILED+1))
            fi
          done

          CACHED=$(ls SRPMS/*.src.rpm 2>/dev/null | wc -l)
          echo "=== SRPMs: built=$BUILT failed=$FAILED skipped=$SKIPPED cached=$CACHED (полные логи: logs/srpm-*.log) ==="

      - name: Verify BuildRequires resolve (сухой прогон dnf builddep)
        run: |
          echo "=== dnf builddep --assumeno для пакетов на сабмит — дозор зависимостей ==="
          CHECK=$(python3 bin/coprase-status.py check 2>&1)
          TO_SUBMIT=$(echo "$CHECK" | grep -E "has SRPM" | awk '{print $1}' || true)
          [ -n "$TO_SUBMIT" ] || { echo "Нет пакетов на сабмит"; exit 0; }
          echo "Проверяю: $(echo "$TO_SUBMIT" | tr '\n' ' ')"
          for name in $TO_SUBMIT; do
            srpm=$(ls SRPMS/$name-*.src.rpm 2>/dev/null | head -1)
            [ -n "$srpm" ] || continue
            bin/check-deps.sh "$srpm" || true
          done
          BLOCKED=$(ls SRPMS/blocked/*.src.rpm 2>/dev/null | wc -l)
          echo "=== Блокировано dnf-дозором: $BLOCKED (в SRPMS/blocked/, в COPR не уйдут) ==="

      - name: Submit to COPR (dedup with version comparison)
        run: python3 bin/coprase-status.py submit ${{ inputs.full_rebuild == true && '--force' || '' }} 2>&1 | tee logs/submit.log

      - name: Auto-triage (fix known failures)
        if: always()
        run: bin/auto-triage.sh || true

      - name: Auto-issue (report failures)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/auto-issue.sh || true

      - name: Commit state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE" 2>/dev/null || cd "$(pwd)" || exit 0
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          echo "=== Commit state step ==="
          if [ ! -d ".git" ]; then
            echo "нет .git — поднимаю репозиторий и сохраняю локальные изменения"
            git init -q
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git -c protocol.version=2 fetch -q --depth=50 origin master
            git reset --mixed FETCH_HEAD 2>&1 | tail -2 || true
            git checkout -qb master 2>/dev/null || true
            echo "=== Коммит локальных изменений (state.json) ==="
          fi
          git config user.name "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          git add state/state.json pkgs.json SPECS/ 2>&1 || true
          echo "Files staged:"
          git diff --cached --stat || true
          if ! git diff --cached --quiet; then
            git commit -qm "submit sync [skip ci]" || echo "Commit failed"
            git branch "bot/submit-${{ github.run_number }}"
            git checkout -q "bot/submit-${{ github.run_number }}"
            git push -q origin "bot/submit-${{ github.run_number }}" 2>&1 ||               echo "Push failed (non-critical)"
            gh pr create --base master --head "bot/submit-${{ github.run_number }}"               --title "submit sync #${{ github.run_number }} [skip ci]"               --body "State sync от scheduled submit (без прямой записи в master). Merge = только если ревьюер подтвердил." 2>&1 ||               echo "PR create failed (non-critical)"
          else
            echo "No changes to commit"
          fi
          echo "=== Commit state done ==="

      - name: Telegram notification
        if: always()
        run: |
          if [ -f ~/.config/candy/tg.conf ]; then
            CHAT_ID=$(grep -oP 'TG_CHAT_ID=\K.*' ~/.config/candy/tg.conf | head -1)
            BOT_TOKEN=$(grep -oP 'TG_BOT_TOKEN=\K.*' ~/.config/candy/tg.conf | head -1)
          fi
          CHAT_ID="${CHAT_ID:-${{ secrets.TG_CHAT_ID }}}"
          BOT_TOKEN="${BOT_TOKEN:-${{ secrets.TG_BOT_TOKEN }}}"
          if [ -n "$CHAT_ID" ] && [ -n "$BOT_TOKEN" ]; then
            STATUS="${{ job.status }}"
            MSG="🤖 <b>candy submit</b>: ${STATUS}"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" -d parse_mode=HTML -d text="$MSG" >/dev/null 2>&1 || true
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: submit-logs-${{ github.run_number }}
          path: logs/
