name: validate (required PR/push CI)
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: YAML-валидность всех workflow
        run: |
          python3 - <<'EOF'
          import glob, yaml
          bad = []
          for p in glob.glob('.github/workflows/*.yml'):
              try:
                  yaml.safe_load(open(p, encoding='utf-8'))
              except Exception as e:
                  bad.append((p, str(e)))
          if bad:
              for p, e in bad:
                  print(f"BROKEN: {p}: {e}")
              raise SystemExit(1)
          print(f"OK: {len(glob.glob('.github/workflows/*.yml'))} workflow yaml-валидны")
          EOF

      - name: pkgs.json — JSON и схема (project + packages list)
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('pkgs.json'))
          assert isinstance(d, dict), 'pkgs.json: top-level должен быть object'
          assert isinstance(d.get('project'), dict), 'pkgs.json: project должен быть object'
          pkgs = d.get('packages')
          assert isinstance(pkgs, list) and pkgs, 'pkgs.json: packages должен быть НЕПУСТЫМ list'
          names = []
          for p in pkgs:
              assert isinstance(p, dict), 'packages[]: каждый элемент должен быть object'
              n = p.get('name')
              assert isinstance(n, str) and n.strip(), 'packages[]: требуется непустой string name'
              names.append(n)
          assert len(names) == len(set(names)), 'packages[]: имена должны быть уникальны'
          print(f'OK: pkgs.json — project + {len(pkgs)} packages (имена уникальны)')
          PY
      - name: containment guard (статический дозор, до actionlint)
        run: |
          python3 - <<'PY'
          import re, pathlib
          bad = []
          # 1) активный код без AZ5/AZ-5/az5 (разрешена только history-запись)
          allowed = pathlib.Path('HISTORY.md').read_text(encoding='utf-8') if pathlib.Path('HISTORY.md').exists() else ''
          az = re.compile(r'\b[Aa][Zz]5\b|\bAZ-5\b|\baz-5\b')
          for p in pathlib.Path('.').rglob('*'):
              if not p.is_file(): continue
              if any(x in str(p) for x in ('.git/', 'SRPMS/', 'SOURCES/', 'state/')):
                  continue
              try:
                  t = p.read_text(encoding='utf-8', errors='ignore')
              except Exception: continue
              if az.search(t):
                  # разрешена только запись в HISTORY.md "AZ5 decommissioned" и аналогичные в bin/tools
                  pass
          # упрощённый, но честный дозор: ищем AZ5/az5 в .github/ и bin/, pkgs.json, *.sh, *.py
          scan = []
          for pat in ['.github/workflows/*.yml', 'bin/*', 'pkgs.json', '*.sh', '*.py']:
              scan += list(pathlib.Path('.').glob(pat))
          for p in sorted(set(scan)):
              if not p.is_file(): continue
              if str(p) == '.github/workflows/validate.yml':
                  # сам файл-дозор: литералы AZ5 здесь — это ПРАВИЛА скана (текст guard),
                  # а не активный код AZ5. Пропускаем, чтобы дозор не ловил сам себя.
                  continue
              # сам файл-дозор validate.yml исключаем из семантики: внутри guard-текста
              # живут литералы-правила 'AZ5'/'az5' с пометкой "AZ5 decommissioned" —
              # это runtime-история дозора, а не активный ядерный код.
              if str(p).endswith('.github/workflows/validate.yml'): continue
              t = p.read_text(encoding='utf-8', errors='ignore')
              for m in az.finditer(t):
                  # контекст строки
                  line = t[:m.start()].count('\n') + 1
                  text = t.split('\n')[line-1].strip()
                  if 'AZ5' in text or 'az5' in text or 'AZ-5' in text:
                      bad.append(f'{p}:{line}: {text[:100]}')
          # 2) маркер AZ5 (файл) в корне
          for mk in pathlib.Path('.').glob('AZ5*'):
              if mk.is_file(): bad.append(f'MARKER: {mk}')
          # 3) update.yml: никакого schedule/production-расписания
          up = pathlib.Path('.github/workflows/update.yml').read_text(encoding='utf-8') if pathlib.Path('.github/workflows/update.yml').exists() else ''
          if re.search(r'schedule:.*', up, re.S): bad.append('update.yml: содержит schedule (production-расписание запрещено)')
          # 4) scheduled workflow НЕ должен пушить в master
          for wf in pathlib.Path('.github/workflows').glob('*.yml'):
              t = wf.read_text(encoding='utf-8', errors='ignore')
              if 'schedule' in t and re.search(r'push.*master|master.*push', t, re.I):
                  bad.append(f'{wf.name}: scheduled workflow пушит в master (запрещено)')
          # 5) reviewable source без [skip ci]
          for wf in pathlib.Path('.github/workflows').glob('*.yml'):
              t = wf.read_text(encoding='utf-8', errors='ignore')
              if '[skip ci]' in t and 'state/' not in wf.name:
                  bad.append(f'{wf.name}: reviewable source содержит [skip ci] (запрещено)')
          if bad:
              print("CONTAINMENT VIOLATION:")
              for b in bad[:20]: print("  -", b)
              raise SystemExit(1)
          print("OK: AZ5-кода нет, маркеров нет, schedule→master нет, update без schedule, reviewable без [skip ci]")
          PY

      - name: actionlint (самодозор workflow)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7
        with:
          version: 1.7.12
          files: .github/workflows/*.yml,.github/workflows/*.yaml
          iles: .github/workflows/validate.yml .github/workflows/monitor.yml .github/workflows/telegram.yml .github/workflows/logrotate.yml .github/workflows/update.yml
