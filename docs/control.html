<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЦУП — terminal-rpm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e14;--panel:#111820;--border:#1e2a38;--border-hi:#2a3a4e;
  --text:#8b9bb4;--text-hi:#c5d0e0;--text-bright:#e6edf5;
  --green:#00e676;--green-dim:#004d26;--green-glow:rgba(0,230,118,.15);
  --amber:#ffc107;--amber-dim:#4d3800;--amber-glow:rgba(255,193,7,.15);
  --red:#ff1744;--red-dim:#4d0713;--red-glow:rgba(255,23,68,.15);
  --blue:#448aff;--blue-dim:#132d4d;--blue-glow:rgba(68,138,255,.15);
  --cyan:#00e5ff;--purple:#b388ff;
  --font:'JetBrains Mono','Fira Code','SF Mono',monospace;
  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}
@font-face{font-family:'Inter';src:local('Inter')}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:3px}

/* ── GRID LAYOUT ── */
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100vh}
.header{grid-column:1/-1;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:100}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:12px 0;overflow-y:auto}
.main{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}

/* ── HEADER ── */
.logo{font-size:14px;font-weight:700;color:var(--text-bright);letter-spacing:1px;display:flex;align-items:center;gap:10px}
.logo .reactor{width:28px;height:28px;border:2px solid var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--green-glow)}50%{box-shadow:0 0 0 8px transparent}}
.header-status{display:flex;gap:16px;margin-left:auto;font-size:11px}
.status-chip{display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg)}
.status-chip .dot{width:6px;height:6px;border-radius:50%}
.dot-green{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot-amber{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.dot-red{background:var(--red);box-shadow:0 0 6px var(--red)}
.dot-blue{background:var(--blue);box-shadow:0 0 6px var(--blue)}
.header-time{color:var(--text);font-size:11px;font-variant-numeric:tabular-nums}

/* ── SIDEBAR ── */
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--text);font-size:12px;cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.03);color:var(--text-hi)}
.nav-item.active{background:rgba(68,138,255,.08);color:var(--blue);border-left-color:var(--blue)}
.nav-item .icon{width:18px;text-align:center;font-size:14px}
.nav-section{padding:16px 16px 6px;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text);opacity:.5}
.nav-divider{height:1px;background:var(--border);margin:8px 16px}

/* ── PANELS / CARDS ── */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.panel-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:12px;font-weight:600;color:var(--text-hi);display:flex;align-items:center;gap:8px}
.panel-body{padding:16px}
.panel-badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text)}

/* ── GAUGES ── */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.gauge{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;overflow:hidden}
.gauge::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.gauge-green::before{background:var(--green)}
.gauge-amber::before{background:var(--amber)}
.gauge-red::before{background:var(--red)}
.gauge-blue::before{background:var(--blue)}
.gauge-value{font-size:36px;font-weight:700;line-height:1}
.gauge-value.green{color:var(--green)}
.gauge-value.amber{color:var(--amber)}
.gauge-value.red{color:var(--red)}
.gauge-value.blue{color:var(--blue)}
.gauge-label{font-size:11px;color:var(--text);text-transform:uppercase;letter-spacing:1px}
.gauge-sub{font-size:10px;color:var(--text);opacity:.6}

/* ── INDICATOR LIGHTS ── */
.lights{display:flex;gap:12px;flex-wrap:wrap}
.light{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--border);border-radius:4px;font-size:11px;background:var(--bg)}
.light-led{width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.1)}
.led-green{background:var(--green);box-shadow:0 0 8px var(--green),inset 0 0 2px rgba(255,255,255,.3)}
.led-amber{background:var(--amber);box-shadow:0 0 8px var(--amber),inset 0 0 2px rgba(255,255,255,.3)}
.led-red{background:var(--red);box-shadow:0 0 8px var(--red);animation:blink-red 1s infinite}
.led-off{background:#1a1a2e;box-shadow:inset 0 0 3px rgba(0,0,0,.5)}
@keyframes blink-red{0%,100%{opacity:1}50%{opacity:.3}}

/* ── TABLE ── */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text);font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:1px;position:sticky;top:0;background:var(--panel)}
td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text-hi)}
tr:hover td{background:rgba(255,255,255,.02)}
.tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:600}
.tag-running{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,230,118,.3)}
.tag-pending{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(255,193,7,.3)}
.tag-succeeded{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,230,118,.3)}
.tag-failed{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,23,68,.3)}
.tag-canceled{background:var(--border);color:var(--text);border:1px solid var(--border-hi)}

/* ── BUTTONS ── */
.btn{font-family:var(--font);font-size:11px;padding:6px 14px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text-hi);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--border-hi);background:var(--panel)}
.btn-primary{border-color:var(--blue);color:var(--blue)}
.btn-primary:hover{background:var(--blue-dim)}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-dim)}
.btn-success{border-color:var(--green);color:var(--green)}
.btn-success:hover{background:var(--green-dim)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-group{display:flex;gap:8px}

/* ── TOGGLE ── */
.toggle{position:relative;width:36px;height:20px;cursor:pointer}
.toggle input{display:none}
.toggle-track{position:absolute;inset:0;background:var(--border);border-radius:10px;transition:.2s}
.toggle input:checked+.toggle-track{background:var(--green)}
.toggle-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked~.toggle-thumb{left:18px}

/* ── SEARCH ── */
.search{position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text-hi);font-family:var(--font);font-size:12px;outline:none}
.search input:focus{border-color:var(--blue)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text);font-size:12px}

/* ── LOG VIEWER ── */
.log{background:#050810;border:1px solid var(--border);border-radius:4px;padding:12px;font-size:11px;line-height:1.6;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.log .ts{color:var(--text);opacity:.5}
.log .ok{color:var(--green)}
.log .warn{color:var(--amber)}
.log .err{color:var(--red)}
.log .info{color:var(--blue)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border-hi);border-radius:8px;width:90%;max-width:500px;max-height:80vh;overflow-y:auto}
.modal-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:14px;color:var(--text-bright)}
.modal-close{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer}
.modal-body{padding:16px}
.modal-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* ── CHROOT GRID ── */
.chroot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.chroot-card{padding:10px;border:1px solid var(--border);border-radius:4px;display:flex;align-items:center;justify-content:space-between;font-size:11px;background:var(--bg)}
.chroot-card.active{border-color:var(--green);background:var(--green-glow)}
.chroot-card.inactive{border-color:var(--border);opacity:.5}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .gauges{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">

<!-- ═══════════ HEADER ═══════════ -->
<header class="header">
  <div class="logo">
    <div class="reactor">⚛</div>
    <span>ЦУП <span style="color:var(--text);font-weight:400">terminal-rpm</span></span>
  </div>
  <div class="header-status">
    <div class="status-chip"><div class="dot dot-green" id="dot-copr"></div><span>COPR</span></div>
    <div class="status-chip"><div class="dot dot-green" id="dot-gh"></div><span>GitHub</span></div>
    <div class="status-chip"><div class="dot dot-blue" id="dot-wf"></div><span id="wf-status">—</span></div>
  </div>
  <div class="header-time" id="clock">--:--:--</div>
</header>

<!-- ═══════════ SIDEBAR ═══════════ -->
<nav class="sidebar">
  <div class="nav-section">Мониторинг</div>
  <div class="nav-item active" data-page="overview"><span class="icon">◉</span>Обзор</div>
  <div class="nav-item" data-page="builds"><span class="icon">▶</span>Билды</div>
  <div class="nav-item" data-page="logs"><span class="icon">≡</span>Логи</div>
  <div class="nav-divider"></div>
  <div class="nav-section">Управление</div>
  <div class="nav-item" data-page="packages"><span class="icon">☐</span>Пакеты</div>
  <div class="nav-item" data-page="chroots"><span class="icon">⊞</span>Чруты</div>
  <div class="nav-item" data-page="workflows"><span class="icon">⟳</span>Воркфлоу</div>
  <div class="nav-divider"></div>
  <div class="nav-section">Система</div>
  <div class="nav-item" data-page="settings"><span class="icon">⚙</span>Настройки</div>
  <div class="nav-item" data-page="danger"><span class="icon">⚠</span>Опасная зона</div>
</nav>

<!-- ═══════════ MAIN ═══════════ -->
<main class="main" id="content"></main>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h3 id="modal-title"></h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════
// CONFIG
// ══════════════════════════════════════
const COPR_API = 'https://copr.fedorainfracloud.org/api_3';
const COPR_OWNER = 'arcticlore';
const COPR_PROJECT = 'terminal-rpm';
const GH_REPO = 'arcticlore/candy-rpm';
const CHROOTS = ['fedora-44-x86_64','fedora-44-aarch64','fedora-43-x86_64','fedora-43-aarch64'];

// ══════════════════════════════════════
// STATE
// ══════════════════════════════════════
let state = {
  builds: [], pkgs: [], workflows: [],
  pkgsJson: null,
  selectedPage: 'overview',
  refreshTimer: null,
};

// ══════════════════════════════════════
// FETCH HELPERS
// ══════════════════════════════════════
async function fetchCopr(path) {
  try {
    const r = await fetch(`${COPR_API}${path}`);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e) {
    document.getElementById('dot-copr').className = 'dot dot-red';
    console.error('COPR API error:', e);
    return null;
  }
}

async function fetchAllBuilds() {
  let all = [], offset = 0;
  while (true) {
    const d = await fetchCopr(`/build/list?ownername=${COPR_OWNER}&projectname=${COPR_PROJECT}&limit=200&offset=${offset}`);
    if (!d || !d.items || d.items.length === 0) break;
    all.push(...d.items);
    if (d.items.length < 200) break;
    offset += 200;
  }
  return all;
}

// ══════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    state.selectedPage = el.dataset.page;
    render();
  });
});

// ══════════════════════════════════════
// RENDER ENGINE
// ══════════════════════════════════════
function render() {
  const pages = {overview:renderOverview, builds:renderBuilds, packages:renderPackages,
                 chroots:renderChroots, workflows:renderWorkflows, settings:renderSettings,
                 danger:renderDanger, logs:renderLogs};
  const fn = pages[state.selectedPage] || renderOverview;
  document.getElementById('content').innerHTML = fn();
  bindEvents();
}

// ── OVERVIEW ──
function renderOverview() {
  const b = state.builds;
  const running = b.filter(x => x.state==='running'||x.state==='starting').length;
  const pending = b.filter(x => x.state==='pending').length;
  const succeeded = new Set(b.filter(x => x.state==='succeeded').map(x=>x.source_package.name)).size;
  const failed = new Set(b.filter(x => x.state==='failed').map(x=>x.source_package.name)).size;
  const total = state.pkgsJson ? state.pkgsJson.packages.length : '—';
  const enabled = state.pkgsJson ? state.pkgsJson.packages.filter(p=>p.enabled!==false).length : '—';
  const successRate = succeeded+failed>0 ? Math.round(succeeded/(succeeded+failed)*100) : 0;

  return `
    <div class="gauges">
      <div class="gauge ${running>0?'gauge-green':'gauge-blue'}">
        <div class="gauge-value ${running>0?'green':'blue'}">${running}</div>
        <div class="gauge-label">Активных</div>
        <div class="gauge-sub">билдов сейчас</div>
      </div>
      <div class="gauge gauge-amber">
        <div class="gauge-value amber">${pending}</div>
        <div class="gauge-label">Очередь</div>
        <div class="gauge-sub">ожидают</div>
      </div>
      <div class="gauge gauge-green">
        <div class="gauge-value green">${succeeded}</div>
        <div class="gauge-label">Собрано</div>
        <div class="gauge-sub">уникальных пакетов</div>
      </div>
      <div class="gauge ${failed>0?'gauge-red':'gauge-green'}">
        <div class="gauge-value ${failed>0?'red':'green'}">${failed}</div>
        <div class="gauge-label">Ошибки</div>
        <div class="gauge-sub">не собрались</div>
      </div>
      <div class="gauge gauge-blue">
        <div class="gauge-value blue">${successRate}%</div>
        <div class="gauge-label">Успешность</div>
        <div class="gauge-sub">succeeded/(succeeded+failed)</div>
      </div>
      <div class="gauge gauge-blue">
        <div class="gauge-value" style="color:var(--text-bright)">${enabled}<span style="font-size:16px;color:var(--text)">/${total}</span></div>
        <div class="gauge-label">Пакетов</div>
        <div class="gauge-sub">включено / всего</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">⚡ Индикаторы системы</div>
        <button class="btn btn-primary" onclick="refreshAll()">⟳ Обновить</button>
      </div>
      <div class="panel-body">
        <div class="lights">
          <div class="light"><div class="light-led led-green"></div>COPR API</div>
          <div class="light"><div class="light-led ${running>0?'led-green':'led-off'}"></div>Билды ${running>0?`(${running})`:''}</div>
          <div class="light"><div class="light-led ${pending>0?'led-amber':'led-off'}"></div>Очередь ${pending>0?`(${pending})`:''}</div>
          <div class="light"><div class="light-led ${failed>0?'led-red':'led-off'}"></div>Ошибки ${failed>0?`(${failed})`:''}</div>
          <div class="light"><div class="light-led led-green"></div>GitHub Actions</div>
          <div class="light"><div class="light-led led-green"></div>Telegram Bot</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">▶ Последние билды</div>
        <span class="panel-badge">${b.length} всего</span>
      </div>
      <div class="panel-body table-wrap">
        <table>
          <tr><th>Пакет</th><th>Статус</th><th>Chroot</th><th>ID</th></tr>
          ${b.slice(0,15).map(x => `
            <tr>
              <td style="color:var(--text-bright)">${x.source_package.name}</td>
              <td><span class="tag tag-${x.state}">${x.state}</span></td>
              <td style="font-size:11px">${x.build_chroots?.[0]?.name || '—'}</td>
              <td style="opacity:.5">#${x.id}</td>
            </tr>
          `).join('')}
        </table>
      </div>
    </div>
  `;
}

// ── BUILDS ──
function renderBuilds() {
  const b = state.builds;
  const counts = {};
  b.forEach(x => { counts[x.state] = (counts[x.state]||0)+1; });

  return `
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">▶ Все билды COPR</div>
        <div class="btn-group">
          <button class="btn" onclick="state._buildFilter='';render()">Все (${b.length})</button>
          <button class="btn" onclick="state._buildFilter='running';render()">Активные (${(counts.running||0)+(counts.starting||0)})</button>
          <button class="btn" onclick="state._buildFilter='pending';render()">Очередь (${counts.pending||0})</button>
          <button class="btn" onclick="state._buildFilter='succeeded';render()">OK (${counts.succeeded||0})</button>
          <button class="btn" onclick="state._buildFilter='failed';render()">Ошибки (${counts.failed||0})</button>
          <button class="btn btn-primary" onclick="refreshAll()">⟳</button>
        </div>
      </div>
      <div class="panel-body table-wrap" style="max-height:calc(100vh - 200px);overflow-y:auto">
        <table>
          <tr><th>ID</th><th>Пакет</th><th>Статус</th><th>Создан</th><th>Действия</th></tr>
          ${b.filter(x => !state._buildFilter || x.state===state._buildFilter).map(x => `
            <tr>
              <td style="opacity:.5">#${x.id}</td>
              <td style="color:var(--text-bright)">${x.source_package.name}</td>
              <td><span class="tag tag-${x.state}">${x.state}</span></td>
              <td style="font-size:11px">${x.created?.replace('T',' ').slice(0,19)||'—'}</td>
              <td>
                ${x.state==='pending'||x.state==='running'||x.state==='starting' ?
                  `<button class="btn btn-danger" onclick="cancelBuild(${x.id})">■ Отменить</button>` : ''}
              </td>
            </tr>
          `).join('')}
        </table>
      </div>
    </div>
  `;
}

// ── PACKAGES ──
function renderPackages() {
  const pkgs = state.pkgsJson?.packages || [];
  const filter = (state._pkgFilter||'').toLowerCase();
  const filtered = pkgs.filter(p => !filter || p.name.toLowerCase().includes(filter));
  const enabled = pkgs.filter(p => p.enabled!==false).length;

  return `
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">☐ Управление пакетами</div>
        <span class="panel-badge">${enabled}/${pkgs.length} активны</span>
      </div>
      <div class="panel-body">
        <div style="display:flex;gap:12px;margin-bottom:12px">
          <div class="search" style="flex:1">
            <span class="search-icon">⌕</span>
            <input placeholder="Поиск пакетов..." value="${state._pkgFilter||''}" oninput="state._pkgFilter=this.value;render()">
          </div>
          <button class="btn btn-success" onclick="bulkToggle(true)">Включить все (${filtered.length})</button>
          <button class="btn btn-danger" onclick="bulkToggle(false)">Выключить все (${filtered.length})</button>
        </div>
        <div class="table-wrap" style="max-height:calc(100vh - 280px);overflow-y:auto">
          <table>

// ══════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════
async function cancelBuild(id) {
  if (!confirm(`Отменить билд #${id}?`)) return;
  try {
    await fetch(`${COPR_API}/build/cancel/${id}`, {method:'POST'});
    setTimeout(refreshAll, 2000);
  } catch(e) { alert('Ошибка: '+e.message); }
}

async function cancelAllBuilds() {
  if (!confirm('Отменить ВСЕ активные билды?')) return;
  const active = state.builds.filter(x => ['pending','running','starting','importing'].includes(x.state));
  let done = 0;
  for (const b of active) {
    try {
      await fetch(`${COPR_API}/build/cancel/${b.id}`, {method:'POST'});
      done++;
    } catch(e) {}
  }
  alert(`Отменено: ${done}/${active.length}`);
  refreshAll();
}

async function togglePkg(name, enabled) {
  if (!state.pkgsJson) return;
  const pkg = state.pkgsJson.packages.find(p => p.name === name);
  if (pkg) pkg.enabled = enabled;
  // In real implementation, would commit to git
  console.log(`${enabled?'Enable':'Disable'}: ${name}`);
  render();
}

function bulkToggle(enabled) {
  if (!state.pkgsJson) return;
  if (!confirm(`${enabled?'Включить':'Выключить'} все отфильтрованные пакеты?`)) return;
  const filter = (state._pkgFilter||'').toLowerCase();
  state.pkgsJson.packages.forEach(p => {
    if (!filter || p.name.toLowerCase().includes(filter)) {
      p.enabled = enabled;
    }
  });
  render();
}

async function triggerWorkflow(name) {
  // In real implementation, would use GitHub API with token
  alert(`Запуск ${name}...\n(Требуется GitHub token для API вызова)`);
}

async function toggleNet(enable) {
  if (!confirm(`Отключить сеть для билдов?`)) return;
  try {
    const r = await fetch(`${COPR_API}/project/edit/${COPR_OWNER}/${COPR_PROJECT}`, {
      method: 'PUT',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({enable_net: enable})
    });
    alert(enable ? 'Сеть включена' : 'Сеть отключена');
  } catch(e) { alert('Ошибка: '+e.message); }
}

async function deleteProject() {
  if (!confirm('ВЫ УВЕРЕНЫ? Это удалит ВСЕ билды и настройки проекта!')) return;
  if (!confirm('ПОСЛЕДНЕЕ ПРЕДУПРЕЖДЕНИЕ. Проект будет удалён навсегда.')) return;
  alert('Удаление проекта требует copr-cli на сервере.\nИспользуйте: copr-cli delete arcticlore/terminal-rpm');
}

function refreshLogs() {
  const el = document.getElementById('sys-log');
  if (el) el.innerHTML = `<span class="info">[${new Date().toISOString()}]</span> Логи загружаются через GitHub API...\n<span class="warn">(Требуется GitHub token для доступа к workflow logs)</span>`;
}

// ══════════════════════════════════════
// MODAL
// ══════════════════════════════════════
function openModal(title, body, footer='') {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-footer').innerHTML = footer;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

// ══════════════════════════════════════
// REFRESH
// ══════════════════════════════════════
async function refreshAll() {
  state.builds = await fetchAllBuilds() || [];

  // Try to fetch pkgs.json from raw GitHub
  try {
    const r = await fetch(`https://raw.githubusercontent.com/${GH_REPO}/master/pkgs.json`);
    if (r.ok) state.pkgsJson = await r.json();
  } catch(e) {}

  document.getElementById('dot-copr').className = 'dot dot-green';
  render();
}

// ══════════════════════════════════════
// CLOCK
// ══════════════════════════════════════
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('ru-RU',{hour12:false});
}
setInterval(updateClock, 1000);
updateClock();

// ══════════════════════════════════════
// INIT

refreshAll();
setInterval(refreshAll, 60000); // auto-refresh every 60s

function bindEvents() {
  // Re-bind any dynamic events after render
  if (state.selectedPage === 'workflows') refreshLogs();
}
